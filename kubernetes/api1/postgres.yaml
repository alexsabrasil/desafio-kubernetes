apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-api1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-api1
  template:
    metadata:
      labels:
        app: postgres-api1
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: api_database
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api1-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-api1
spec:
  selector:
    app: postgres-api1
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP