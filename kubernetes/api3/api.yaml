apiVersion: apps/v1
kind: Deployment
metadata:
  name: api3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api3
  template:
    metadata:
      labels:
        app: api3
    spec:
      containers:
        - name: api3
          image: desafio-api3:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: postgres-api3
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: mydatabase
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api3-db-secret
                  key: POSTGRES_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: api3
spec:
  selector:
    app: api3
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP