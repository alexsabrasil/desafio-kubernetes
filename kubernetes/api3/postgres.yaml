apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-api3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-api3
  template:
    metadata:
      labels:
        app: postgres-api3
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mydatabase
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api3-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: initdb
          configMap:
            name: api3-initdb

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-api3
spec:
  selector:
    app: postgres-api3
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP